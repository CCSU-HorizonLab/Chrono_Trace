openapi: 3.0.3
info:
  title: Chrono Trace Affinity Analysis API
  description: Bridge API for conversation affinity analysis system
  version: 1.0.0
  contact:
    name: Chrono Trace Team

servers:
  - url: http://localhost:5173/api
    description: Local development server (PyWebView bridge)

paths:
  /affinity/analyze:
    post:
      summary: Trigger affinity analysis for a conversation
      description: |
        Performs complete affinity analysis including:
        - Sentiment analysis (if not cached)
        - Interaction pair construction
        - All 4 dimension calculations
        - Overall score computation

        Analysis runs asynchronously. Use `/affinity/progress/{task_id}` to check progress.
      operationId: analyzeAffinity
      tags:
        - Affinity Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversation_id
              properties:
                conversation_id:
                  type: integer
                  description: Conversation ID to analyze
                  example: 42
                force_reanalyze:
                  type: boolean
                  description: Force re-analysis even if cached results exist
                  default: false
                config_overrides:
                  type: object
                  description: Temporary configuration overrides (not persisted)
                  properties:
                    weight_emotional_resonance:
                      type: number
                      minimum: 0.0
                      maximum: 1.0
                    reply_timeliness_threshold:
                      type: integer
                      minimum: 60
                      description: Threshold in seconds
                  example:
                    reply_timeliness_threshold: 7200
      responses:
        '200':
          description: Analysis task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task_id:
                    type: string
                    description: Unique task identifier for progress tracking
                    example: "affinity_42_20260108_123456"
                  estimated_duration_ms:
                    type: integer
                    description: Estimated analysis time in milliseconds
                    example: 45000
        '400':
          description: Invalid request (missing conversation_id, invalid config)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error during analysis initialization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affinity/progress/{task_id}:
    get:
      summary: Get analysis progress
      description: Query the status of an ongoing affinity analysis task
      operationId: getAffinityProgress
      tags:
        - Affinity Analysis
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: Task ID from /affinity/analyze response
          example: "affinity_42_20260108_123456"
      responses:
        '200':
          description: Task status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task_id:
                    type: string
                    example: "affinity_42_20260108_123456"
                  status:
                    type: string
                    enum: [pending, running, completed, failed]
                    example: "running"
                  progress_percent:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 65
                  current_step:
                    type: string
                    example: "Calculating emotional resonance score"
                  error:
                    type: string
                    description: Error message if status = failed
                    nullable: true
                  result:
                    $ref: '#/components/schemas/AffinityResult'
                    description: Populated if status = completed
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affinity/scores/{conversation_id}:
    get:
      summary: Get cached affinity scores for a conversation
      description: |
        Retrieves the most recent affinity analysis results.
        Returns 404 if no analysis exists for this conversation.
      operationId: getAffinityScores
      tags:
        - Affinity Analysis
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
          description: Conversation ID
          example: 42
      responses:
        '200':
          description: Affinity scores retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AffinityResult'
        '404':
          description: No affinity analysis found for this conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affinity/config/{conversation_id}:
    get:
      summary: Get affinity configuration for a conversation
      operationId: getAffinityConfig
      tags:
        - Configuration
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AffinityConfig'
        '404':
          description: Configuration not found (using defaults)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AffinityConfig'
                    description: Default configuration

    put:
      summary: Update affinity configuration for a conversation
      operationId: updateAffinityConfig
      tags:
        - Configuration
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffinityConfigUpdate'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AffinityConfig'
        '400':
          description: Invalid configuration (weights don't sum to 1.0, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affinity/keywords:
    get:
      summary: Get all keyword libraries
      operationId: getKeywords
      tags:
        - Keywords
      responses:
        '200':
          description: Keywords retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      positive_words:
                        type: array
                        items:
                          type: string
                      negative_words:
                        type: array
                        items:
                          type: string
                      empathy_words:
                        type: array
                        items:
                          type: string
                      soothing_words:
                        type: array
                        items:
                          type: string
                      privacy_keywords:
                        type: array
                        items:
                          type: string
                      holiday_greetings:
                        type: array
                        items:
                          type: string

    post:
      summary: Add custom keywords
      operationId: addKeywords
      tags:
        - Keywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - keywords
              properties:
                category:
                  type: string
                  enum: [positive_words, negative_words, empathy_words, soothing_words, privacy_keywords, holiday_greetings]
                keywords:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        '200':
          description: Keywords added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  added_count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: string
                    description: Updated keyword list for this category

    delete:
      summary: Remove keywords
      operationId: removeKeywords
      tags:
        - Keywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - keywords
              properties:
                category:
                  type: string
                  enum: [positive_words, negative_words, empathy_words, soothing_words, privacy_keywords, holiday_greetings]
                keywords:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        '200':
          description: Keywords removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  removed_count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: string

  /affinity/preference-keywords/{conversation_id}:
    get:
      summary: Get preference keywords for a conversation
      operationId: getPreferenceKeywords
      tags:
        - Keywords
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Preference keywords retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: string
                    example: ["篮球", "电影", "旅行"]

    put:
      summary: Update preference keywords for a conversation
      operationId: updatePreferenceKeywords
      tags:
        - Keywords
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keywords
              properties:
                keywords:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Preference keywords updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: string

components:
  schemas:
    AffinityResult:
      type: object
      description: Complete affinity analysis result
      properties:
        conversation_id:
          type: integer
          example: 42
        overall_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 100.0
          description: Overall affinity score (weighted sum of 4 dimensions)
          example: 78.5
        dimension_scores:
          type: object
          properties:
            emotional_resonance:
              type: number
              format: float
              example: 82.3
            chat_positivity:
              type: number
              format: float
              example: 75.1
            attitude_tendency:
              type: number
              format: float
              example: 68.9
            preference_compatibility:
              type: number
              format: float
              example: 85.0
        sub_scores:
          type: object
          description: Detailed breakdown of all sub-dimensions
          properties:
            emotional_resonance:
              type: object
              properties:
                bidirectional_positive_response:
                  type: number
                  format: float
                  description: 20% weight
                  example: 85.0
                polarity_consistency:
                  type: number
                  format: float
                  description: 15% weight
                  example: 78.5
                intensity_matching:
                  type: number
                  format: float
                  description: 10% weight
                  example: 72.0
                empathy_recognition:
                  type: number
                  format: float
                  description: 30% weight
                  example: 80.0
                negative_resolution:
                  type: number
                  format: float
                  description: 25% weight
                  example: 90.0
            chat_positivity:
              type: object
              properties:
                daily_message_count:
                  type: number
                  format: float
                  description: 10% weight
                  example: 70.0
                reply_timeliness:
                  type: number
                  format: float
                  description: 20% weight
                  example: 82.5
                avg_message_length:
                  type: number
                  format: float
                  description: 10% weight
                  example: 75.0
                long_text_ratio:
                  type: number
                  format: float
                  description: 15% weight
                  example: 68.0
                topic_continuity:
                  type: number
                  format: float
                  description: 20% weight
                  example: 73.5
                active_initiation:
                  type: number
                  format: float
                  description: 25% weight
                  example: 78.0
            attitude_tendency:
              type: object
              properties:
                positive_words:
                  type: number
                  format: float
                  description: 25% weight
                  example: 72.0
                negative_words:
                  type: number
                  format: float
                  description: -20% weight (reverse scoring)
                  example: 15.0
                multimedia_usage:
                  type: number
                  format: float
                  description: 10% weight
                  example: 65.0
                nickname_usage:
                  type: number
                  format: float
                  description: 25% weight
                  example: 80.0
                privacy_sharing:
                  type: number
                  format: float
                  description: 20% weight
                  example: 55.0
                holiday_greetings:
                  type: number
                  format: float
                  description: 10% weight
                  example: 40.0
            preference_compatibility:
              type: object
              properties:
                topic_mention_frequency:
                  type: number
                  format: float
                  description: 40% weight
                  example: 85.0
                preference_topic_continuity:
                  type: number
                  format: float
                  description: 60% weight
                  example: 85.0
        interpretation:
          type: object
          description: Human-readable interpretations for each dimension
          properties:
            overall:
              type: string
              example: "总体好感度较高,对方对这段关系较为重视"
            emotional_resonance:
              type: string
              example: "情感共振强烈,双方情绪高度同步"
            chat_positivity:
              type: string
              example: "对方积极度高,回复及时且主动"
            attitude_tendency:
              type: string
              example: "态度友好,表达亲密"
            preference_compatibility:
              type: string
              example: "兴趣高度契合,常聊共同喜好"
        statistics:
          type: object
          description: Basic statistics about the conversation
          properties:
            total_messages:
              type: integer
              example: 1523
            total_interaction_pairs:
              type: integer
              example: 425
            conversation_duration_days:
              type: integer
              example: 45
            analysis_duration_ms:
              type: integer
              example: 45000
        analyzed_at:
          type: integer
          description: Unix timestamp of analysis
          example: 1704662400

    AffinityConfig:
      type: object
      description: Affinity analysis configuration
      properties:
        conversation_id:
          type: integer
        dimension_weights:
          type: object
          properties:
            emotional_resonance:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              example: 0.30
            chat_positivity:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              example: 0.30
            attitude_tendency:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              example: 0.20
            preference_compatibility:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              example: 0.20
        thresholds:
          type: object
          properties:
            reply_timeliness_threshold_seconds:
              type: integer
              minimum: 60
              description: Reply considered timely if within this threshold
              example: 3600
            topic_continuity_time_window_seconds:
              type: integer
              minimum: 86400
              description: Time window for topic continuity calculation
              example: 604800
            similarity_threshold_initiation:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              description: Similarity below this = new topic initiation
              example: 0.40
            sliding_window_size:
              type: integer
              minimum: 3
              description: Window size for session splitting
              example: 5
        custom_keywords:
          type: object
          description: Custom keyword overrides per category
          additionalProperties:
            type: array
            items:
              type: string
        preference_keywords:
          type: array
          description: User-provided preference keywords
          items:
            type: string
          example: ["篮球", "电影", "旅行"]
        updated_at:
          type: integer
          description: Last configuration update timestamp

    AffinityConfigUpdate:
      type: object
      description: Fields that can be updated in affinity configuration
      properties:
        dimension_weights:
          type: object
          description: Updated dimension weights (must sum to 1.0)
          properties:
            emotional_resonance:
              type: number
              format: float
            chat_positivity:
              type: number
              format: float
            attitude_tendency:
              type: number
              format: float
            preference_compatibility:
              type: number
              format: float
        thresholds:
          type: object
          properties:
            reply_timeliness_threshold_seconds:
              type: integer
            topic_continuity_time_window_seconds:
              type: integer
            similarity_threshold_initiation:
              type: number
              format: float
            sliding_window_size:
              type: integer
        preference_keywords:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable error message
          example: "Conversation not found"
        error_code:
          type: string
          description: Machine-readable error code
          example: "CONVERSATION_NOT_FOUND"
        details:
          type: object
          description: Additional error details
          additionalProperties: true

tags:
  - name: Affinity Analysis
    description: Core affinity analysis operations
  - name: Configuration
    description: Configuration management
  - name: Keywords
    description: Keyword library management
